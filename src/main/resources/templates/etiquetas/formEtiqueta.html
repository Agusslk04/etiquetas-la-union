<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${form.idProducto != null} ? 'Editar producto' : 'Nueva etiqueta')}"></head>
<body>

	<header th:replace="~{fragments/layout :: encabezado(${form.idProducto != null} ? 'productos' : 'nueva')}"></header>
	<div th:replace="~{fragments/layout :: mensajes}"></div>

	<main class="contenedor">

		<section class="titulo-pagina">
			<h1 th:text="${form.idProducto != null} ? 'Editar producto' : 'Nueva etiqueta'">Nueva etiqueta</h1>
			<p>Cargá los datos, mirá cómo queda y listo.</p>
		</section>

		<div class="dos-columnas">

			<!-- Datos del producto -->
			<form id="formEtiqueta" class="tarjeta" th:action="@{/etiquetas/guardar}" th:object="${form}" method="post"
				autocomplete="off" th:data-url-codigo="@{/codigo-barras}" th:data-url-buscar="@{/productos/buscar}">

				<div class="tarjeta-titulo">
					<h2>Datos del producto</h2>
					<span>Fecha: <strong th:text="${hoy}">01/01/2026</strong></span>
				</div>

				<input type="hidden" th:field="*{idProducto}">

				<div class="campo" th:classappend="${#fields.hasErrors('nombre')} ? 'con-error'">
					<label for="nombre">Nombre del producto</label>
					<input type="text" class="entrada" th:field="*{nombre}" maxlength="60"
						placeholder="Ej: Yerba Playadito 1 kg" required autofocus>
					<small class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
				</div>

				<div class="campo" th:classappend="${#fields.hasErrors('precio')} ? 'con-error'">
					<label for="precio">Precio</label>
					<div class="entrada-precio">
						<span>$</span>
						<input type="text" class="entrada" th:field="*{precio}" inputmode="decimal" maxlength="14"
							placeholder="0" required>
					</div>
					<small class="error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></small>
				</div>

				<div class="campo" th:classappend="${#fields.hasErrors('codigoBarras')} ? 'con-error'">
					<label for="codigoBarras">Código de barras</label>
					<input type="text" class="entrada entrada-codigo" th:field="*{codigoBarras}" maxlength="40"
						placeholder="Escaneá o escribí el código" required>
					<small class="error" th:if="${#fields.hasErrors('codigoBarras')}" th:errors="*{codigoBarras}"></small>
					<small class="ayuda" id="avisoCodigo" th:unless="${#fields.hasErrors('codigoBarras')}"></small>
				</div>

				<div class="botones">
					<button type="submit" name="accion" value="imprimir" class="boton boton-principal" id="botonImprimir">
						<svg th:replace="~{fragments/layout :: icono-imprimir}"></svg>
						Imprimir etiqueta
					</button>
					<button type="submit" name="accion" value="hoja" class="boton boton-secundario">
						<svg th:replace="~{fragments/layout :: icono-hoja}"></svg>
						Agregar a hoja A4
					</button>
				</div>
				<button type="submit" name="accion" value="guardar" class="boton-texto">Solo guardar, sin imprimir</button>
			</form>

			<!-- Vista previa -->
			<section class="tarjeta vista-previa">
				<div class="tarjeta-titulo">
					<h2>Vista previa</h2>
					<span>Tamaño real: <strong>13 × 8 cm</strong></span>
				</div>
				<div class="zona-previa">
					<div class="marco-etiqueta" data-escala>
						<article th:replace="~{fragments/etiqueta :: etiqueta(${form.nombre}, ${form.precioEntero}, ${form.precioCentavos}, ${form.codigoBarras}, ${hoy})}"></article>
					</div>
				</div>
				<p class="nota">Todo lo que imprimís queda guardado en <a th:href="@{/productos}">Productos</a>.</p>
			</section>

		</div>
	</main>

	<footer th:replace="~{fragments/layout :: pie}"></footer>
	<script th:src="@{/js/etiqueta.js}"></script>
	<script th:src="@{/js/formulario.js}"></script>
</body>
</html>
