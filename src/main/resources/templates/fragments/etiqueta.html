<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

	<!--
		Etiqueta de precio 13 x 8 cm.
		Se usa igual en la vista previa del panel y en las hojas A4 que se imprimen.
	-->
	<article th:fragment="etiqueta(nombre, entero, centavos, codigo, fecha)" class="etiqueta">

		<svg class="et-fondo" viewBox="0 0 130 80" preserveAspectRatio="none" aria-hidden="true">
			<defs>
				<linearGradient id="etGradMancha" x1="0" y1="0" x2="1" y2="1">
					<stop offset="0" stop-color="#FBD490" />
					<stop offset="1" stop-color="#F7A64A" />
				</linearGradient>
				<linearGradient id="etGradOlaFondo" x1="0" y1="0" x2="1" y2="0">
					<stop offset="0" stop-color="#FAB43C" />
					<stop offset=".5" stop-color="#F59B2E" />
					<stop offset="1" stop-color="#FAB43C" />
				</linearGradient>
				<linearGradient id="etGradOla" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0" stop-color="#F27832" />
					<stop offset="1" stop-color="#E4531D" />
				</linearGradient>
			</defs>

			<!-- Manchas en las esquinas superiores (espejadas) -->
			<path d="M0 0H27C23 7.5 13.5 13 0 15.5Z" fill="url(#etGradMancha)" />
			<path d="M130 0H103C107 7.5 116.5 13 130 15.5Z" fill="url(#etGradMancha)" />

			<!-- Ola inferior en dos tonos (simétrica) -->
			<path d="M0 62.5C21 57.5 43 67 65 67S109 57.5 130 62.5V80H0Z" fill="url(#etGradOlaFondo)" />
			<path d="M0 67C21 62.5 43 71.5 65 71.5S109 62.5 130 67V80H0Z" fill="url(#etGradOla)" />

			<!-- Destellos a los lados del logo -->
			<g fill="none" stroke="#ED672B" stroke-width="1.1" stroke-linecap="round">
				<path d="M35 6.2 37.8 8.6M34 10.6H37.8M35 15 37.8 12.6" />
				<path d="M95 6.2 92.2 8.6M96 10.6H92.2M95 15 92.2 12.6" />
			</g>
		</svg>

		<img class="et-logo" th:src="@{/img/logo-la-union.png}" alt="La Unión Supermercado">

		<div class="et-nombre">
			<span th:text="${#strings.isEmpty(nombre)} ? 'Nombre del producto' : ${nombre}"
				th:classappend="${#strings.isEmpty(nombre)} ? 'et-vacio'">Nombre del producto</span>
		</div>

		<div class="et-precio">
			<div class="et-precio-valor">
				<span class="et-signo">$</span>
				<span class="et-entero" th:text="${entero}">0</span>
				<span class="et-centavos" th:text="${centavos}"
					th:classappend="${#strings.isEmpty(centavos)} ? 'vacio'"></span>
			</div>
		</div>

		<div class="et-lado izq">
			<small>Fecha</small>
			<strong th:text="${fecha}">01/01/2026</strong>
		</div>

		<div class="et-codigo" th:classappend="${#strings.isEmpty(codigo)} ? 'et-vacio'">
			<img th:src="@{/codigo-barras(valor=${#strings.isEmpty(codigo)} ? '0000000000000' : ${codigo})}" alt="">
			<span th:text="${#strings.isEmpty(codigo)} ? 'Código de barras' : ${codigo}">Código de barras</span>
		</div>

		<div class="et-lado der">
			<small>IVA incluido</small>
			<strong>Precio final</strong>
		</div>

	</article>

</body>
</html>
