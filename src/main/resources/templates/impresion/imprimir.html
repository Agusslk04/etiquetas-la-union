<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Imprimir · Etiquetas La Unión</title>
	<link rel="icon" type="image/png" th:href="@{/img/icono.png}">
	<link rel="stylesheet" th:href="@{/css/fuentes.css}">
	<link rel="stylesheet" th:href="@{/css/etiqueta.css}">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<link rel="stylesheet" th:href="@{/css/impresion.css}">
	<!-- 9 x 5, 6,5 x 3 y media A4 van en hoja A4 vertical -->
	<style th:if="${formato.hojaVertical}">@page { size: A4 portrait; margin: 0; }</style>
	<script th:src="@{/js/comun.js}" defer></script>
</head>
<body class="pagina-impresion" th:classappend="'formato-' + ${formato.clave} + (${formato.hojaVertical} ? ' hoja-vertical' : '')
	+ (${formato.cartel} ? ' hoja-carteles' : '')">

	<!-- Barra (no se imprime) -->
	<div class="barra-impresion no-imprimir">
		<div class="izquierda">
			<a th:href="@{${volver}}" class="boton boton-secundario boton-chico" th:text="'‹ ' + ${textoVolver}">‹ Volver</a>
		</div>
		<div class="barra-info">
			<strong th:text="${formato.cantidad(totalEtiquetas)}">1 etiqueta de 13 × 8 cm</strong>
			<span th:text="(${formato.hojaVertical} ? 'A4 vertical · ' : 'A4 horizontal · ') + ${paginas.size()}
				+ (${paginas.size() == 1} ? ' hoja · ' : ' hojas · ') + ${formato.porHoja} + ' por hoja'">A4 horizontal · 1 hoja</span>
			<!-- Cambiar de tamaño (vuelve a armar las hojas) -->
			<th:block th:if="${urlFormato != null}">
				<nav th:replace="~{fragments/formato :: enlaces(${urlFormato})}"></nav>
			</th:block>
		</div>
		<div class="derecha">
			<form th:if="${origen == 'hoja'}" th:action="@{/hoja}" method="post">
				<button type="submit" name="accion" value="vaciar" class="boton boton-secundario boton-chico"
					data-confirmar="¿Vaciar la hoja? Los productos siguen guardados.">Vaciar hoja</button>
			</form>
			<button type="button" class="boton boton-principal boton-chico" onclick="window.print()">
				<svg th:replace="~{fragments/layout :: icono-imprimir}"></svg>
				Imprimir
			</button>
		</div>
	</div>

	<!-- Excel (solo imprimir): filas que no se pudieron usar -->
	<details class="aviso-impresion no-imprimir" th:if="${filasConError != null and !filasConError.isEmpty()}">
		<summary th:text="${conError == 1} ? '1 fila del Excel tiene errores y no se imprimió (ver)'
			: ${conError} + ' filas del Excel tienen errores y no se imprimieron (ver)'">Filas con errores</summary>
		<ul>
			<li th:each="f : ${filasConError}" th:text="${f}"></li>
		</ul>
	</details>

	<!-- Hojas A4 -->
	<div class="hojas">
		<div class="hoja-marco" th:each="pagina : ${paginas}">
			<section class="hoja">

				<!-- Marcas de corte · 13 x 8: A4 horizontal, 2 x 2 -->
				<svg th:if="${formato.clave == 'grande'}" class="marcas-corte" viewBox="0 0 297 210" aria-hidden="true">
					<g stroke="#9A9AA6" stroke-width=".25">
						<path d="M18.5 16v6M148.5 16v6M278.5 16v6M18.5 188v6M148.5 188v6M278.5 188v6" />
						<path d="M9.5 25h6M9.5 105h6M9.5 185h6M281.5 25h6M281.5 105h6M281.5 185h6" />
					</g>
				</svg>

				<!-- Marcas de corte · 9 x 5: A4 vertical, 2 x 5 -->
				<svg th:if="${formato.clave == 'mini'}" class="marcas-corte" viewBox="0 0 210 297" aria-hidden="true">
					<g stroke="#9A9AA6" stroke-width=".25">
						<path d="M15 15.5v6M105 15.5v6M195 15.5v6M15 275.5v6M105 275.5v6M195 275.5v6" />
						<path d="M7 23.5h6M7 73.5h6M7 123.5h6M7 173.5h6M7 223.5h6M7 273.5h6" />
						<path d="M197 23.5h6M197 73.5h6M197 123.5h6M197 173.5h6M197 223.5h6M197 273.5h6" />
					</g>
				</svg>

				<!-- Marcas de corte · 6,5 x 3: A4 vertical, 3 x 9 -->
				<svg th:if="${formato.clave == 'chica'}" class="marcas-corte" viewBox="0 0 210 297" aria-hidden="true">
					<g stroke="#9A9AA6" stroke-width=".25">
						<path d="M7.5 6.5v5M72.5 6.5v5M137.5 6.5v5M202.5 6.5v5M7.5 285.5v5M72.5 285.5v5M137.5 285.5v5M202.5 285.5v5" />
						<path d="M2.5 13.5h3M2.5 43.5h3M2.5 73.5h3M2.5 103.5h3M2.5 133.5h3M2.5 163.5h3M2.5 193.5h3M2.5 223.5h3M2.5 253.5h3M2.5 283.5h3" />
						<path d="M204.5 13.5h3M204.5 43.5h3M204.5 73.5h3M204.5 103.5h3M204.5 133.5h3M204.5 163.5h3M204.5 193.5h3M204.5 223.5h3M204.5 253.5h3M204.5 283.5h3" />
					</g>
				</svg>

				<div class="grilla">
					<th:block th:each="p : ${pagina}">
						<article th:replace="~{fragments/etiqueta :: etiqueta(${p.nombre}, ${p.precioEntero}, ${p.precioCentavos}, ${p.codigoBarras}, ${hoy}, ${formato}, ${p.unidadesOferta})}"></article>
					</th:block>
				</div>
			</section>
		</div>
	</div>

	<p class="consejo no-imprimir">
		Si algo sale corrido, en la ventana de impresión elegí <strong>Escala: Predeterminada</strong>
		y <strong>Márgenes: Ninguno</strong>.
		<th:block th:unless="${formato.cartel}">Cortá siguiendo las marcas grises.</th:block>
		<th:block th:if="${formato.cartel and formato.porHoja == 2}">Cortá la hoja por la mitad.</th:block>
	</p>

	<script th:src="@{/js/etiqueta.js}"></script>
	<script th:src="@{/js/impresion.js}"></script>
</body>
</html>
