spring.application.name=etiquetas-la-union

# ===== SERVIDOR =====
# En esta compu: http://localhost:8081
# Desde otras compus de la red: http://IP-DE-ESTA-COMPU:8081 (se muestra en el pie del panel)
server.address=0.0.0.0
server.port=8081
# La sesión (para los avisos) viaja solo por cookie, nunca como ;jsessionid en la URL
server.servlet.session.tracking-modes=cookie

# ===== ARCHIVOS CSS, JS E IMÁGENES =====
# Cada archivo se publica con un código según su contenido (por ejemplo etiqueta-3f2a9c....css).
# Cuando se actualiza el sistema cambia la dirección, y el navegador baja la versión nueva sí o sí
# (antes podía quedarse con el CSS viejo y dibujar el cartelito chico del tamaño del grande).
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.use-last-modified=false

# ===== CARGA DE EXCEL =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=-1

# ===== CONEXION A POSTGRESQL =====
# La base "etiquetas_launion" se crea sola la primera vez que arranca el sistema.
spring.datasource.url=jdbc:postgresql://localhost:5432/etiquetas_launion
spring.datasource.username=postgres
spring.datasource.password=postgre24

# ===== REGISTRO =====
# Corriendo como sistema no hay ventana: los mensajes quedan en sistema\logs\etiquetas.log
logging.file.name=logs/etiquetas.log

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
